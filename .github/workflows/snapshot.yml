name: Обновление снимка данных

on:
  schedule:
    - cron: "6,26,46 * * * *"   # базовый такт: каждые 20 минут по «незагруженным» минутам
    - cron: "16,36,56 13-21 * * 1-5"  # быстрая полоса: торговые часы США (13–21 UTC) → такт 10 минут
  workflow_dispatch:             # кнопка ручного запуска и вызовы внешнего будильника через API
  push:                          # правка воркфлоу/скриптов/страницы пере-регистрирует расписание и сразу даёт запуск
    branches: [main]             # v4.12: только main — правки в служебных ветках (data) снимок не трогают
    paths:
      - ".github/workflows/snapshot.yml"
      - "scripts/**"
      - "!scripts/notify*.mjs"   # уведомления снимок не собирают: их правка не должна гнать лишнюю
                                 # пересборку и лишний деплой Pages поверх идущего (сборка Pages
                                 # занимает ~35 с, две подряд — старшая отменяется, сайт замирает)
      - "docs/index.html"        # сборщик извлекает боевые регэкспы из страницы — её правка требует пересборки

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    # СБОРЩИК ЖИВЁТ НА VPS. Здесь он остаётся целиком, но выключенным: 6 августа
    # авария GitHub Actions остановила сбор данных на семь часов при полностью
    # исправных источниках, и панель, которая читает двадцать девять чужих API,
    # не обязана зависеть ещё и от очереди раннеров. Теперь такт даёт systemd-таймер
    # `dash-837.timer`, а обвязка — `/usr/local/sbin/dash-snapshot`.
    #
    # Условие, а не удаление файла: два писателя в один репозиторий — это гонка за
    # docs/snapshot.json и два ответа на вопрос «какие сейчас данные». Чтобы вернуть
    # сбор сюда, достаточно завести переменную репозитория COLLECTOR=github и
    # остановить таймер на сервере — именно в этом порядке.
    if: vars.COLLECTOR == 'github'
    runs-on: ubuntu-latest
    timeout-minutes: 12          # v4.13.6: 15 → 12. Прогон-зомби 24.07 жил все 15 минут при дедлайне
                                 # сборщика 8 мин — значит висел ВНЕ node (checkout/push); держать
                                 # раннер лишние 3 минуты незачем.
                                 # страховка узла; собственный дедлайн сборщика — 8 мин (v4.13.5):
                                 # он жёсткий (за ним источники пропускаются, значения берёт merge),
                                 # поэтому прогон успевает опубликоваться и до этого таймаута, и до
                                 # отмены следующим тиком быстрой полосы (такт 10 мин, cancel-in-progress)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Сбор данных
        env:
          FRED_KEY:    ${{ secrets.FRED_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}     # опционально: серверный LLM-судья новостей (v4.10)
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'nvidia/nemotron-3-ultra-550b-a55b:free' }}
        run: node scripts/fetch-snapshot.mjs
      - name: Публикация снимка
        id: commit
        run: |
          git config user.name  "razlom26-bot"
          git config user.email "bot@users.noreply.github.com"
          # v4.13.6: свежесобранный снимок — источник истины. Раньше гонка с чужим пушем
          # (правка страницы, уведомления) роняла rebase, и такт терялся целиком: собранные
          # данные просто выбрасывались. Наш снимок всегда новее удалённого, поэтому при
          # конфликте берём удалённую голову и кладём свой файл поверх — до 3 попыток.
          cp docs/snapshot.json "$RUNNER_TEMP/snapshot.json"
          for attempt in 1 2 3; do
            git add docs/snapshot.json
            if git diff --cached --quiet; then echo "снимок не изменился"; exit 0; fi
            git commit -m "снимок $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
            if git pull --rebase origin main && git push; then
              echo "опубликовано с попытки $attempt"; exit 0
            fi
            echo "попытка $attempt: гонка с чужим пушем — переношу снимок на свежую голову"
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/snapshot.json" docs/snapshot.json
          done
          echo "не удалось опубликовать за 3 попытки"; exit 1

      # То, что читает живая страница, лежит здесь, а не в коммите выше. Коммит —
      # история и то, из чего снимок восстанавливается; бакет — то, что открывает
      # браузер. Раньше вторым была публикация GitHub Pages, и она связывала частоту
      # данных (четыре такта в час) с частотой пересборки сайта — около сотни сборок
      # в сутки; 6 августа очередь Pages встала, и страница несколько часов показывала
      # то, что давно лежало в репозитории.
      #
      # Условие, а не `always()`, и не умолчание. Проигранная гонка за пуш не должна
      # лишать читателя свежих данных — эти две публикации независимы, и ни одна не
      # вправе отменять другую; ровно тот урок, который стоил соседней панели шести
      # часов простоя. Но `always()` пустил бы сюда и провал СБОРА, а сборщик пишет
      # docs/snapshot.json на месте: недописанный файл уехал бы читателю как текущие
      # данные. Поэтому пропускаем ровно один вид отказа — отказ коммита.
      #
      # curl --aws-sigv4, а не AWS CLI: R2 говорит по протоколу S3, подпись у curl
      # встроенная, и это на одну зависимость меньше.
      - name: Опубликовать снимок в R2
        if: success() || steps.commit.conclusion == 'failure'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Разбор перед отправкой. Сборщик пишет файл на месте, и обрезанный JSON —
          # это не «плохие данные», а страница, которая не открывается вовсе.
          node -e 'JSON.parse(require("fs").readFileSync("docs/snapshot.json","utf8"))'
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          code=$(curl -sS -X PUT -o "$RUNNER_TEMP/r2-put.log" -w '%{http_code}' \
            --user "${R2_ACCESS_KEY_ID}:${R2_SECRET_ACCESS_KEY}" \
            --aws-sigv4 "aws:amz:auto:s3" \
            -H "Content-Type: application/json" \
            --data-binary @docs/snapshot.json \
            "${endpoint}/dash-837/snapshot.json")
          if [ "$code" != "200" ]; then
            echo "::error::R2 PUT вернул $code"; cat "$RUNNER_TEMP/r2-put.log"; exit 1
          fi
          # Читаем обратно и сверяем побайтово: успешный PUT говорит, что запрос принят,
          # а вопрос другой — лежит ли в бакете именно тот снимок, что собрал этот прогон.
          curl -sS --fail \
            --user "${R2_ACCESS_KEY_ID}:${R2_SECRET_ACCESS_KEY}" \
            --aws-sigv4 "aws:amz:auto:s3" \
            -o "$RUNNER_TEMP/r2-readback.json" \
            "${endpoint}/dash-837/snapshot.json"
          if ! cmp -s docs/snapshot.json "$RUNNER_TEMP/r2-readback.json"; then
            echo "::error::в R2 лежит не то, что опубликовали"; exit 1
          fi
          echo "опубликовано $(wc -c < docs/snapshot.json) байт, сверено побайтово"
