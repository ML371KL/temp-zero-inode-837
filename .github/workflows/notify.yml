name: Уведомления в Telegram

# Запускается ПОСЛЕ штатного прогона снимка: собственный GitHub-cron в этих репозиториях
# ненадёжен, а снимок дёргается внешним будильником — так уведомления наследуют его такт.
# Панель считает карточки В БРАУЗЕРЕ, поэтому состояние снимается headless-прогоном страницы:
# это исключает вторую копию логики скоринга на сервере (она бы неизбежно разошлась).
on:
  workflow_run:
    workflows: ["Обновление снимка данных"]
    types: [completed]
  workflow_dispatch:
    inputs:
      ping:
        description: "Проверка связи: отправить одно тестовое сообщение и выйти"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      # ref: main — ОБЯЗАТЕЛЬНО. По умолчанию workflow_run забирает коммит, на котором СТАРТОВАЛ
      # прогон снимка, то есть состояние ДО коммита свежего снимка. Уведомления читали бы
      # прошлый цикл и опаздывали ровно на один такт.
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      # Потеря кэша безопасна: скрипт зафиксирует базу заново и промолчит — худший исход это
      # пропуск уведомления, а не лавина сообщений.
      - name: Восстановить состояние уведомлений
        uses: actions/cache@v5
        with:
          path: .notify/state.json
          key: razlom26-notify-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            razlom26-notify-${{ github.ref_name }}-

      - name: Тесты уведомлений
        run: node scripts/notify-test.mjs

      - name: Chrome для снятия состояния страницы
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then echo "Chrome на раннере не найден"; exit 1; fi
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          npm i --no-save --no-package-lock --no-audit --no-fund puppeteer-core

      - name: Разослать изменения
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          NOTIFY_MODEL: ${{ vars.NOTIFY_MODEL }}
          NOTIFY_SOURCE: page
          # Страница поднимается ЛОКАЛЬНО из свежего чекаута: публикация Pages идёт уже после
          # старта уведомлений, и чтение по сети давало данные предыдущего цикла (замер в проде
          # 28.07: страница прочитана в 14:16:19, деплой свежего снимка закончился в 14:16:37).
          # Заодно уведомления перестают зависеть от здоровья Pages.
          NOTIFY_PAGE_DIR: docs
          NOTIFY_STATE: .notify/state.json
          NOTIFY_PING: ${{ inputs.ping && '1' || '0' }}
          NEXUS_EVENTS_URL: ${{ vars.NEXUS_EVENTS_URL }}
          NEXUS_SOURCE_ID: "837"
          NEXUS_INGEST_TOKEN: ${{ secrets.NEXUS_INGEST_TOKEN }}
          NEXUS_SITES_TOKEN: ${{ secrets.NEXUS_SITES_TOKEN }}
        run: node scripts/notify.mjs
